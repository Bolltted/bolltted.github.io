name: Submit URLs to Google Indexing API

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is different

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Google API client
        run: pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Write service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > service-account-key.json

      - name: Submit URLs to Indexing API
        run: |
          python <<EOF
          import subprocess
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          # Your site URL
          SITE_URL = 'https://keylantarasoff.com'

          # Get changed files from the push
          try:
              changed_files = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD']).decode().splitlines()
          except subprocess.CalledProcessError:
              print("No previous commit found.")
              changed_files = []

          urls = [f'{SITE_URL}/{f}' if not f.startswith('/') else f'{SITE_URL}{f}' for f in changed_files]

          # Authenticate with service account
          credentials = service_account.Credentials.from_service_account_file(
              'service-account-key.json',
              scopes=['https://www.googleapis.com/auth/indexing']
          )
          service = build('indexing', 'v3', credentials=credentials)

          # Submit URLs
          for url in urls:
              try:
                  response = service.urlNotifications().publish(
                      body={'url': url, 'type': 'URL_UPDATED'}
                  ).execute()
                  print(f'Submitted {url} successfully.')
              except HttpError as e:
                  print(f'Error submitting {url}: {e}')
          EOF
